project:
  type: book
  output-dir: docs

execute:
  warning: false
  message: false
  freeze: false

theme: 
  - default
  - custom_ukds.scss
  
book:
  title: "Getting Started with the LFS"
  subtitle: "Four exercises to learn to work with  the Labour Force Survey"
  downloads: [pdf]
  author: UK Data Service
  output-file: "LFS_Exercices"
  date: "June 2025"
  date-format: MMMMYYYY

  chapters:
      - index.qmd
      - part: "**1. Temporary work**"
        chapters:
        - exercise_1.qmd
        - exercise_1_Stata.qmd
        - exercise_1_spss.qmd
      - part: "**2. Weekly earnings**"
        chapters:
        - exercise_2.qmd
        - exercise_2_Stata.qmd
        - exercise_2_spss.qmd
      - part: "**3. Labour Market Flows**"
        chapters:
        - exercise_3.qmd
        - exercise_3_Stata.qmd
        - exercise_3_spss.qmd
      - part: "**4. Estimates precision**"
        chapters:
        - exercise_4.qmd
        - exercise_4_Stata.qmd
        - exercise_4_spss.qmd

  sidebar: 
    logo: "pics/UKDS_Logos_Col_Grey_300dpi.png"
    logo-href: https://ukdataservice.ac.uk
    logo-alt: "Link to the UK Data Service homepage"
    style: "floating"
    search: true
    title: " "

jupyter: nbstata

format:
    html: 
      code-overflow: scroll
      code-line-numbers: true
      page-layout: full
      toc: true
      toc-location: right
      highlight-style: arrow-light
      smooth-scroll: true
      link-external-newwindow: true
      citations-hover: true
      footnotes-hover: true
      css: ukds_long.css
      number-sections: false
    
titlepage-pdf:
     titlepage: plain
     titlepage-geometry:
      - top=70mm
      - left=30mm
      - right=30mm
      - bottom=30mm
     titlepage-theme:
      logo-size: 3cm
      title-fontstyle: Huge
     titlepage-logo: "pics/UKDS_Logos_Col_Grey_300dpi.png"  
     documentclass: scrreport
     fig-width: 7
     papersize: A4
     include-in-header: preamble.tex
     geometry:
      - top=25mm
      - left=25mm
      - right=25mm
      - bottom=30mm

